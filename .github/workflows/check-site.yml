name: Check site

# Runs on every pull request, and is called by the deploy workflow (deploy.yml) before every deploy,
# so a push that fails any of these never reaches the live site.
on:
  pull_request:
  workflow_call:

# Least privilege: the check only reads the code.
permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # full history, so the lastmod check can compare with the base branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Links, images, metadata, nav, sitemap, security rules
        env:
          # On pull requests, pages changed since the base branch must have a newer sitemap lastmod.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_site.py
      - name: JavaScript syntax
        run: for f in docs/*.js; do node --check "$f"; done

  # The W3C Nu HTML Checker (the validator behind validator.w3.org). Errors only: a green run means no
  # invalid markup, such as an element in the wrong place, a bad attribute or a skipped heading level.
  # Runs on the Java and Node that ubuntu-latest already has. The version is pinned.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the validator
        run: npm install --prefix "$RUNNER_TEMP/vnu" --no-audit --no-fund vnu-jar@26.10.7
      - name: Validate every page
        run: java -jar "$RUNNER_TEMP/vnu/node_modules/vnu-jar/build/dist/vnu.jar" --errors-only --skip-non-html docs/*.html

  # Opens every page in a real browser at 360px (phone) and 1280px (desktop). See scripts/check_browser.js:
  # no sideways scroll, no serious accessibility problems (axe), nothing loaded from outside the site, no CSP errors.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check every page
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/check_browser.js
