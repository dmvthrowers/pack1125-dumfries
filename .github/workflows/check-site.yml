name: Check site

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the check only reads the code.
permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Links, images, metadata, nav, sitemap, security rules
        run: python3 scripts/check_site.py
      - name: JavaScript syntax
        run: for f in docs/*.js; do node --check "$f"; done
