name: Check site

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the check only reads the code.
permissions:
  contents: read

concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Links, images, metadata, nav, sitemap, security rules
        run: python3 scripts/check_site.py
      - name: JavaScript syntax
        run: for f in docs/*.js; do node --check "$f"; done
