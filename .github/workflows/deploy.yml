name: Build and deploy

# Checks the site in docs/ (check-site.yml) and publishes it to GitHub Pages. A push that fails the
# checks never reaches the live site.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *" # every morning, so calendar changes reach the site within a day
  workflow_dispatch:     # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same checks that run on every pull request: site rules, W3C HTML validation, and the browser checks.
  checks:
    uses: ./.github/workflows/check-site.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Optional. With a repository secret named CALENDAR_ICS_URL (the pack calendar's "Secret address in iCal
      # format"), upcoming events are pulled from Google Calendar onto the Calendar page and into calendar.ics.
      # This changes only this build's copy of docs/; nothing is committed. Without the secret it does nothing.
      - name: Pull events from the pack calendar
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          CALENDAR_TZ: ${{ vars.CALENDAR_TZ || 'America/New_York' }}
          CALENDAR_SHOW_PLACES: ${{ vars.CALENDAR_SHOW_PLACES }}
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/sync_calendar.py
          python3 scripts/publish_events.py
          python3 scripts/check_site.py
      - name: Find the site address
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
