name: Check outside links

# Monthly check that the outside links on the site (NCAC, Scouting America, forms) still work.
# Not run on pull requests: outside sites can be down for reasons unrelated to a change.
# A red run lists each broken link and the pages it is on; fix or remove it there.
on:
  schedule:
    - cron: "17 13 1 * *"   # 1st of each month
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Outside links
        run: python3 scripts/check_links.py
